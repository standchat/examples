<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halloween mode — creative masters</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{--ink:#241e19;--cream:#f5edda;--orange:#f7a038;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:var(--cream)}
.canvas{position:relative;overflow:hidden;width:1200px;height:1500px;background:var(--cream)}.eyebrow{font-size:18px;letter-spacing:3px;font-weight:700;text-transform:uppercase}.headline{font-family:Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:-2.5px;line-height:.97;margin:0}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-5px;line-height:1.02}.tiny{font-size:17px;letter-spacing:1px}.rule{height:1px;background:var(--ink);opacity:.45}.art{position:absolute;object-fit:cover}.footer{position:absolute;bottom:45px;left:62px;right:62px;display:flex;align-items:center;justify-content:space-between;font-size:17px;letter-spacing:1px}.star{font-size:52px;font-family:Georgia,serif}.browser{background:#fffaf0;border:2px solid var(--ink);border-radius:15px;position:relative;box-shadow:10px 10px 0 #241e1912}.chrome{height:46px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:7px;padding:0 18px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}.url{font-size:11px;letter-spacing:1px;margin-left:48px}.web-nav{display:flex;justify-content:space-between;padding:28px;font-size:13px;font-weight:700;letter-spacing:1px}.web-title{font-family:Georgia,serif;font-size:54px;line-height:.98;letter-spacing:-2px;margin:12px 28px}.web-line{height:6px;background:#d8d1c3;margin:14px 28px;width:57%}.web-line.short{width:39%}.web-button{display:inline-block;margin:20px 28px;padding:12px 19px;border:1px solid var(--ink);border-radius:30px;font-size:12px}.sprite{position:absolute;filter:drop-shadow(0 8px 4px #241e1910)}.chat{position:absolute;background:var(--ink);color:var(--cream);border-radius:26px;padding:15px 21px;font-size:15px}.chat:after{content:'';position:absolute;right:28px;bottom:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--ink)}
/* Social preview: exact 1200 × 630. */
.og{height:630px;background:var(--orange)}.og .brand{position:absolute;top:42px;left:48px;font-size:24px;font-weight:700;letter-spacing:-1px;z-index:2}.og .art{width:670px;height:447px;right:-18px;top:112px;object-fit:cover;mix-blend-mode:normal}.og .copy{position:absolute;left:48px;top:139px;z-index:2}.og h1{font-size:96px}.og .sub{font-size:25px;line-height:1.3;margin:23px 0 0}.og .chips{display:flex;gap:8px;margin-top:27px}.chip{border:1px solid var(--ink);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700}.og .base{position:absolute;bottom:27px;left:48px;right:48px;padding-top:16px;border-top:1px solid #241e1977;display:flex;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:.5px}.og .hello{position:absolute;right:64px;top:69px;transform:rotate(7deg);background:var(--cream);border:1px solid var(--ink);border-radius:28px;padding:14px 21px;font:italic 22px Georgia,serif}
.og.reddit-landscape h1{font-size:82px}.og.reddit-landscape .copy{top:132px}.og.reddit-landscape .sub{margin-top:17px}.og.reddit-landscape .chips{margin-top:22px}
/* Paid social: promise first, visual proof, one action. */
.reddit{background:var(--orange)}.reddit .eyebrow{position:absolute;left:65px;top:56px}.reddit .star{position:absolute;right:69px;top:38px}.reddit h1{position:absolute;left:59px;top:130px;font-size:110px;line-height:.95;z-index:2}.reddit .art{left:0;top:475px;width:1200px;height:800px;mix-blend-mode:normal}.reddit .hello{position:absolute;top:590px;right:44px;transform:rotate(8deg);font:italic 27px Georgia,serif;background:var(--cream);border:2px solid var(--ink);padding:22px 27px;border-radius:50%}.reddit .bottom{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:var(--cream);height:248px;padding:42px 65px}.reddit .bottom p{margin:0;font-size:29px}.reddit .bottom .details{font-size:17px;color:#e8d6b9;margin-top:15px;letter-spacing:.3px}.reddit .cta{margin-top:28px;display:flex;align-items:center;justify-content:space-between}.reddit .cta strong{font-size:24px;letter-spacing:-1px}.reddit .cta span{font-size:18px;padding:14px 23px;border-radius:28px;border:1px solid #f5edda}
/* Editorial companions: no sales copy, no logo, no call to action. */
.editorial .eyebrow{position:absolute;top:57px;left:64px}.editorial .top-rule{position:absolute;left:64px;right:64px;top:102px}.editorial h1{margin:0;position:absolute;top:148px;left:59px;font-size:109px}.editorial .deck{position:absolute;top:417px;left:64px;right:60px;font-size:26px;line-height:1.4;max-width:880px;margin:0}.familiar .comparison{position:absolute;left:64px;right:64px;top:655px;display:grid;grid-template-columns:1fr 1fr;gap:54px}.familiar .comparison .browser{height:483px}.familiar .label{position:absolute;top:-54px;font-size:19px;font-style:italic;font-family:Georgia,serif}.familiar .browser.after{background:#fac87b}.familiar .web-title{font-size:48px}.familiar .after .sprite.ghost{width:186px;top:92px;right:-22px;transform:rotate(9deg)}.familiar .after .sprite.pumpkin{width:113px;bottom:5px;left:12px;transform:rotate(-8deg)}.familiar .after .sprite.bat{width:129px;bottom:58px;right:12px;transform:rotate(-11deg)}.familiar .after .chat{top:329px;left:100px;font-size:13px;white-space:nowrap;padding:13px 15px}.familiar .note{position:absolute;top:1212px;left:64px;right:64px;border-top:1px solid #241e1977;padding-top:26px;font-size:24px;line-height:1.4}.familiar .note strong{font-weight:400;font-style:italic;font-family:Georgia,serif;font-size:32px}.familiar .arrow{position:absolute;top:905px;left:574px;font-size:41px;z-index:3}
.moment{background:var(--orange)}.moment h1{font-size:119px;top:145px;z-index:2}.moment .art{left:0;top:450px;width:1200px;height:800px;mix-blend-mode:normal}.moment .note{margin:0;position:absolute;top:1271px;left:64px;font-size:28px;line-height:1.45}.moment .footer{border-top:1px solid #241e1977;padding-top:24px}
.dial h1{font-size:101px}.dial .deck{top:404px;max-width:890px}.dial .scale{position:absolute;left:64px;right:64px;top:662px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.dial .specimen{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.dial .specimen img{width:186px;height:192px;object-fit:contain;filter:drop-shadow(0 10px 3px #241e1910)}.dial .specimen .number{font:15px monospace;color:#756b5f;margin-top:31px}.dial .specimen .mood{font:italic 21px Georgia,serif;margin-top:12px}.dial .track{position:absolute;left:86px;right:86px;top:1040px;height:2px;background:var(--ink)}.dial .track:after{content:'';display:block;width:31px;height:31px;border-radius:50%;border:2px solid var(--ink);background:var(--orange);position:absolute;left:46%;top:-15px;box-shadow:0 0 0 8px var(--cream)}.dial .ends{position:absolute;top:1090px;left:86px;right:86px;display:flex;justify-content:space-between;font-size:17px}.dial .note{position:absolute;left:64px;right:64px;top:1224px;border-top:1px solid #241e1977;padding-top:29px;display:flex;justify-content:space-between;font-size:22px}.dial .note span{font-family:Georgia,serif;font-style:italic}
</style>
</head>
<body><main id="design"></main>
<script>
const hero='../assets/hero-art.png';
const sprite=(rating,type,classes='')=>`<img class="sprite ${classes}" src="../assets/${rating}/${type}.webp" alt="">`;
const browser=(after=false)=>`<div class="browser ${after?'after':''}"><div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="url">YOUR EVERYDAY WEBSITE</span></div><div class="web-nav"><span>EVERYDAY & CO.</span><span>MENU +</span></div><div class="web-title">Good things.<br>Made simple.</div><div class="web-line"></div><div class="web-line short"></div><span class="web-button">Take a look ↗</span>${after?sprite('pg','ghost','ghost')+sprite('pg','pumpkin','pumpkin')+sprite('pg','bat','bat')+'<div class="chat">Just floating by. Need a hand?</div>':''}</div>`;
const head=n=>`<div class="eyebrow">Notes on product delight / 0${n}</div><div class="rule top-rule"></div>`;
const foot=(n,label)=>`<div class="footer"><span>${label}</span><span>0${n} / 03</span></div>`;
const designs={
og:`<section class="canvas og"><img class="art" src="${hero}" alt="Ghost, pumpkin and bat escape a paper browser"><div class="brand">Stand Chat</div><div class="copy"><h1 class="headline">HALLOWEEN<br>MODE.</h1><p class="sub">A little haunting.<br>A real conversation.</p><div class="chips"><span class="chip">G</span><span class="chip">PG</span><span class="chip">PG-13</span><span class="chip">R</span><span class="chip">NC-17</span></div></div><div class="hello">Boo. Need a hand?</div><div class="base"><span>FREE FOR YOUR WEBSITE · FIVE MOODS · TAP TO CHAT</span><span>examples.stand.chat/halloween</span></div></section>`,
'reddit-landscape':`<section class="canvas og reddit-landscape"><img class="art" src="${hero}" alt="Friendly ghost, pumpkin and bat escape a paper browser"><div class="brand">Stand Chat</div><div class="copy"><h1 class="headline">FREE<br>HALLOWEEN<br>MODE.</h1><p class="sub">For your website.</p><div class="chips"><span class="chip">One script + assets</span><span class="chip">Five moods</span></div></div><div class="hello">Boo. Need a hand?</div><div class="base"><span>FRIENDLY GHOSTS. REAL CONVERSATIONS.</span><span>Get the free mode ↗</span></div></section>`,
reddit:`<section class="canvas reddit"><div class="eyebrow">Boo, but make it useful.</div><div class="star">✦</div><h1 class="headline">FREE HALLOWEEN<br>MODE FOR<br>YOUR WEBSITE.</h1><img class="art" src="${hero}" alt="Friendly Halloween characters coming out of a website"><div class="hello">Your new<br>ghost host.</div><div class="bottom"><p>Friendly ghosts. Real conversations.</p><p class="details">One script + assets. Five moods. Tap a character to chat.</p><div class="cta"><strong>Stand Chat</strong><span>Get the free mode ↗</span></div></div></section>`,
familiar:`<section class="canvas editorial familiar">${head(1)}<h1 class="serif">Make the familiar<br>feel new.</h1><p class="deck">A seasonal surprise works because you already know<br>what the ordinary version feels like.</p><div class="comparison"><div><span class="label">Every other day.</span>${browser(false)}</div><div><span class="label">One unexpected day.</span>${browser(true)}</div></div><div class="arrow">→</div><div class="note"><strong>Same place. Different feeling.</strong><br><span style="display:block;margin-top:10px">A little personality can change the way a product is remembered.</span></div>${foot(1,'THE FAMILIAR IS THE CANVAS')}</section>`,
moment:`<section class="canvas editorial moment">${head(2)}<h1 class="serif">The moment<br>is the marketing.</h1><img class="art" src="${hero}" alt="An unexpected ghost emerging from an everyday browser"><p class="note">An unexpected detail gives people<br>something worth passing on.</p>${foot(2,'BUILD SOMETHING PEOPLE WANT TO SHOW SOMEONE')}</section>`,
dial:`<section class="canvas editorial dial">${head(3)}<h1 class="serif">Let people choose<br>their kind of weird.</h1><p class="deck">A preschool and a haunted house probably<br>shouldn’t have the same idea of Halloween.</p><div class="scale">${[['g','01','A little hello'],['pg','02','Playful'],['pg-13','03','Eerie'],['r','04','Haunted'],['nc-17','05','After dark']].map(([rating,n,mood])=>`<div class="specimen"><img src="../assets/${rating}/ghost.webp" alt="${mood} ghost"><span class="number">${n}</span><span class="mood">${mood}</span></div>`).join('')}</div><div class="track"></div><div class="ends"><span>A LITTLE SURPRISE</span><span>A FULL TRANSFORMATION</span></div><div class="note"><span>Easy to try.</span><span>Easy to tune.</span><span>Easy to leave.</span></div>${foot(3,'DELIGHT SHOULD FEEL INVITED')}</section>`
};
document.querySelector('#design').innerHTML=designs[new URLSearchParams(location.search).get('design')]||designs.og;
</script>
</body>
</html>
