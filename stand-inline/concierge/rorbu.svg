<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
<title>Red fishermen’s cabins on stilts over the water, below steep snowy peaks in pink twilight</title>
<defs>
  
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4F63A8"/>
    <stop offset=".45" stop-color="#9C98D2"/>
    <stop offset=".8" stop-color="#F0BCC4"/>
    <stop offset="1" stop-color="#FAD5C6"/>
  </linearGradient>
  <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF4F4"/>
    <stop offset="1" stop-color="#E3D6EA"/>
  </linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9AA3D6"/>
    <stop offset="1" stop-color="#7580BA"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="150" x2="0" y2="260" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#B7A9D8"/>
    <stop offset=".25" stop-color="#7A83C0"/>
    <stop offset="1" stop-color="#34487F"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C24A34"/>
    <stop offset="1" stop-color="#A33A2A"/>
  </linearGradient>
  <filter id="ripple" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4 .6"/></filter>
  <radialGradient id="warm-glow">
    <stop offset="0" stop-color="#FFC872" stop-opacity=".8"/>
    <stop offset=".45" stop-color="#FFB257" stop-opacity=".25"/>
    <stop offset="1" stop-color="#FFB257" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE6B0"/>
    <stop offset="1" stop-color="#FFB85C"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

