  <title id="title">Naust Vika: a boathouse at the water</title>
  <desc id="desc">Line drawing: a traditional boathouse with dry-stone side walls, a timber gable with big doors and a steep roof, a stone quay, a small rowing boat on the water, birches and a spruce.</desc>
