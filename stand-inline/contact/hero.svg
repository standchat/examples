<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 1200 456" width="1200" height="456" role="img" aria-labelledby="title desc">
  <title id="title">A house that steps down a slope toward a fjord</title>
  <desc id="desc">Line drawing: a house in two offset levels following a steep slope, with a lit window in the lower level, birches uphill, steps down to a jetty, a sailboat on the fjord and mountains beyond.</desc>
