  <title id="title">Leilighet Nordnes: a 1930s apartment, renovated</title>
  <desc id="desc">Section drawing through a 1930s apartment: slabs and walls cut, a steel-framed window and balcony railing, a built-in bookshelf, a dashed outline where a wall was removed, a pendant over a dining table, and a lounge chair by the window.</desc>
