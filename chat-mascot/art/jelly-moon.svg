<style>
.body{animation:bob 3.4s ease-in-out infinite;transform-origin:120px 30px}
.bell{animation:pulse 3.4s ease-in-out infinite;transform-origin:120px 26px}
.tents{animation:trail 3.4s ease-in-out infinite;transform-origin:120px 104px}
.arms{animation:sway 6.8s ease-in-out infinite alternate;transform-origin:120px 100px}
@keyframes pulse{0%,100%{transform:scale(1,1)}35%{transform:scale(.88,1.08)}60%{transform:scale(1.03,.97)}}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
