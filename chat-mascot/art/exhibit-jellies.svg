<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
<title>Moon jellies and sea nettles glowing in a dark tank</title>
<style>
.bob{animation:bob ease-in-out infinite}
.pulse{animation:pulse ease-in-out infinite}
.sway{animation:sway ease-in-out infinite alternate}
.float{animation:float ease-in-out infinite alternate}
.swim{animation:swim ease-in-out infinite alternate}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise linear infinite}
.flutter{animation:flutter ease-in-out infinite alternate}
.ripple{animation:ripple 3.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1,1)}35%{transform:scale(.9,1.07)}60%{transform:scale(1.03,.97)}}
@keyframes sway{from{transform:skewX(-3deg)}to{transform:skewX(3deg)}}
@keyframes float{from{transform:translateY(-2px) rotate(-1.5deg)}to{transform:translateY(3px) rotate(1.5deg)}}
@keyframes swim{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(3px,calc(var(--rise) * .5))}85%{opacity:.9}100%{transform:translate(-2px,var(--rise));opacity:0}}
@keyframes flutter{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes ripple{from{transform:scale(.6);opacity:.8}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
