="4.2"/></g><g fill="#fff"><circle cx="117.5" cy="143.5" r="1.4"/><circle cx="139.5" cy="143.5" r="1.4"/></g><path d="M121 154h12c0 5-3 8-6 8s-6-3-6-8Z" fill="#2A1A10"/><path d="M121 165q3 4 6 0q3 4 6 0" fill="none" stroke="#3A2618" stroke-width="1.8" stroke-linecap="round"/><g stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"><path d="M116 160h-14M116 164l-13 3M138 160h14M138 164l13 3"/></g><g fill="#FF9E9E" fill-opacity=".5"><ellipse cx="108" cy="156" rx="5" ry="3"/><ellipse cx="146" cy="156" rx="5" ry="3"/></g><path d="M186 120c6-12 22-14 30-4 8 10 0 22-14 22-12 0-20-8-16-18z" fill="#F4A6A0"/><path d="M190 124l14 10M198 118l8 16M208 118l2 16" stroke="#E27F7B" stroke-width="1.6" stroke-linecap="round"/><g fill="#5A3624"><ellipse cx="184" cy="136" rx="9" ry="6" transform="rotate(-30 184 136)"/><ellipse cx="220" cy="136" rx="9" ry="6" transform="rotate(30 220 136)"/></g></g><path d="M80 178q20-4 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0V214H80Z" fill="url(#sea)" fill-opacity=".72"/><g class="float" style="transform-origin:410px 230px;animation-duration:2.6s;animation-delay:-1s"><circle cx="410" cy="232" r="17" fill="#E6D2B6"/><g fill="#B79C7C"><circle cx="398" cy="218" r="4"/><circle cx="422" cy="218" r="4"/></g><circle cx="403" cy="230" r="2.4" fill="#3A2618"/><circle cx="417" cy="230" r="2.4" fill="#3A2618"/><ellipse cx="410" cy="237" rx="3.6" ry="2.6" fill="#3A2618"/><path d="M384 240q6-3 13 0t13 0 13 0 13 0V262H384Z" fill="url(#sea)"/><path d="M386 240q6-3 12 0t12 0 12 0 12 0" fill="none" stroke="#E8FFFC" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/></g><g fill="url(#bub)" stroke="#E6FFFC" stroke-opacity=".6" stroke-width=".8"><circle class="rise" cx="302.1" cy="300" r="2.3" style="--rise:-90px;animation-duration:4s;animation-delay:0s"/><circle class="rise" cx="301.7" cy="300" r="2.8" style="--rise:-90px;animation-duration:6.1s;animation-delay:-3.6s"/></g>
<path d="M0 0H210L0 170Z" fill="url(#glare)"/><path d="M250 0H290L0 236V204Z" fill="#fff" fill-opacity=".04"/>
</svg>