<linearGradient id="armFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE4EA" stop-opacity=".7"/><stop offset="1" stop-color="#FFE4EA" stop-opacity=".1"/></linearGradient>
