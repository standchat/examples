<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 240 500">
<style>
.body{animation:bob 2.8s ease-in-out infinite}
.bell{animation:pulse 2.8s ease-in-out infinite;transform-origin:120px 30px}
.tents{animation:trail 5.6s ease-in-out infinite alternate;transform-origin:120px 118px}
.arms{animation:sway 4.2s ease-in-out infinite alternate;transform-origin:120px 112px}
@keyframes pulse{0%,100%{transform:scale(1,1)}35%{transform:scale(.9,1.07)}60%{transform:scale(1.03,.97)}}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes trail{from{transform:skewX(4deg) scaleY(1)}to{transform:skewX(-5deg) scaleY(1.03)}}
@keyframes sway{from{transform:rotate(-3deg) skewX(4deg)}to{transform:rotate(3deg) skewX(-4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
