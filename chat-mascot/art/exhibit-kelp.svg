<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57C4BC"/><stop offset=".45" stop-color="#248C92"/><stop offset="1" stop-color="#0F5264"/></linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FFF6" stop-opacity=".5"/><stop offset="1" stop-color="#F2FFF6" stop-opacity="0"/></linearGradient>
<linearGradient id="kelpA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3C766"/><stop offset=".5" stop-color="#B59135"/><stop offset="1" stop-color="#7E6424"/></linearGradient>
<linearGradient id="kelpB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB35A"/><stop offset="1" stop-color="#4E6A36"/></linearGradient>
